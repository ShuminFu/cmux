[package]
name = "cmuxd-remote"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "cmux remote daemon: SSH bootstrap RPC, persistent PTY sessions, WebSocket PTY transport, and the remote cmux CLI relay"
license = "MIT"
publish = false

[[bin]]
name = "cmuxd-remote"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
crossbeam-channel = "0.5"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
httparse = "1"
rustix = { version = "1", features = ["event", "fs", "net", "pipe", "process", "pty", "stdio", "termios", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_clone = "warn"

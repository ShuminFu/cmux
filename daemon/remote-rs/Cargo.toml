[package]
name = "cmuxd-remote"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust port of the cmuxd-remote daemon: cmux ssh bootstrap, persistent PTY daemon, proxy RPC, cloud WebSocket transport, and CLI relay."
license = "MIT"
publish = false

[[bin]]
name = "cmuxd-remote"
path = "src/main.rs"

[lib]
name = "cmuxd_remote"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2"
rand = "0.8"
libc = "0.2"
nix = { version = "0.29", features = ["term", "fs", "process", "signal"] }
flume = "0.11"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.26"
ureq = "2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

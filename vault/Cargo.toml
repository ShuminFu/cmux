[package]
name = "cmux-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Discovers local coding-agent session transcripts and syncs them to cmux Vault cloud storage"
license = "MIT"
publish = false

[[bin]]
name = "cmux-vault"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_clone = "warn"
# Ported line-for-line from the Go implementation; these pedantic lints fight
# the deliberately Go-shaped control flow and error strings.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
implicit_hasher = "allow"
